# Production overlay.
# Usage: docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
#
# Both services run the SAME attested image digest: the init sidecar is the application's own
# `materialize-data` entry point, so it inherits the image's non-root user and hardening.
# `!override` replaces (rather than list-merges) the inherited sequences, which would otherwise
# yield duplicate mounts and duplicate security_opt entries.

services:
  clingen-data-init:
    build: !reset null
    image: "${CLINGEN_LINK_IMAGE:?set an attested image@sha256 digest}"
    pull_policy: missing
    environment:
      CLINGEN_LINK_DATA_RELEASE_TAG: "${CLINGEN_LINK_DATA_RELEASE_TAG:-data-clingen-de5f403028d2e1e1}"
      CLINGEN_LINK_DATA_IDENTITY_DIGEST: "${CLINGEN_LINK_DATA_IDENTITY_DIGEST:-sha256:74dc6e1a82f773b17303d33ff82b63c96e9aed0b16fa5f3020b13fd69ffdf789}"

  clingen-link:
    build: !reset null
    image: "${CLINGEN_LINK_IMAGE:?set an attested image@sha256 digest}"
    pull_policy: missing

    environment:
      CLINGEN_LINK_DATA_RELEASE_TAG: "${CLINGEN_LINK_DATA_RELEASE_TAG:-data-clingen-de5f403028d2e1e1}"
      CLINGEN_LINK_DATA_IDENTITY_DIGEST: "${CLINGEN_LINK_DATA_IDENTITY_DIGEST:-sha256:74dc6e1a82f773b17303d33ff82b63c96e9aed0b16fa5f3020b13fd69ffdf789}"
      CLINGEN_LINK_LOG_LEVEL: INFO
      CLINGEN_LINK_CACHE_SIZE: 2000
      CLINGEN_LINK_CACHE_TTL_MINUTES: 120
      CLINGEN_LINK_ALLOWED_HOSTS: '["localhost","127.0.0.1","::1","clingen-link.genefoundry.org"]'
      CLINGEN_LINK_ALLOWED_ORIGINS: '["https://clingen-link.genefoundry.org"]'
      CLINGEN_LINK_CORS_ORIGINS: '["https://clingen-link.genefoundry.org"]'

    # The reverse proxy is the only ingress: publish no host port.
    ports: !reset []
    expose:
      - "8000"

    read_only: true
    volumes: !override
      - type: volume
        source: clingen-reference
        target: /data
        read_only: true
    tmpfs: !override
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt: !override
      - no-new-privileges:true
    cap_drop: !override
      - ALL
    init: true

    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
          pids: 256

    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f -H \"Host: $${GF_HEALTHCHECK_HOST}\" http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

    # Keep the long-running service available after daemon or host restarts.
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
