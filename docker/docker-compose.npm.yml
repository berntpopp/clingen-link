name: clingen-link-npm

services:
  clingen_data_init:
    image: "${CLINGEN_LINK_IMAGE:?set an attested image digest}"
    command: ["clingen-link", "materialize-data"]
    environment:
      CLINGEN_LINK_DATA_BUNDLE_PATH: /seed/clingen.sqlite.zst
      CLINGEN_LINK_DATA_BUNDLE_SHA256: "${CLINGEN_LINK_DATA_BUNDLE_SHA256:?set exact compressed SHA-256}"
      CLINGEN_LINK_DATA_EXPANDED_SHA256: "${CLINGEN_LINK_DATA_EXPANDED_SHA256:?set exact expanded-tree SHA-256}"
      CLINGEN_LINK_DATA_SCHEMA_VERSION: "${CLINGEN_LINK_DATA_SCHEMA_VERSION:-1.0.0}"
      CLINGEN_LINK_DATA_SCHEMA_MINIMUM: "${CLINGEN_LINK_DATA_SCHEMA_MINIMUM:-1.0.0}"
      CLINGEN_LINK_DATA_SCHEMA_MAXIMUM: "${CLINGEN_LINK_DATA_SCHEMA_MAXIMUM:-1.0.0}"
    volumes:
      - "${CLINGEN_LINK_DATA_BUNDLE_PATH:?set reviewed local bundle path}:/seed/clingen.sqlite.zst:ro"
      - clingen_reference:/var/lib/clingen/reference
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  clingen_link:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: clingen-link-npm
    image: "${CLINGEN_LINK_IMAGE:?set an attested image digest}"
    depends_on:
      clingen_data_init:
        condition: service_completed_successfully
    # NO direct ports exposed - NPM handles all routing.
    # Unified server: FastAPI host /health and MCP /mcp via the same port.
    expose:
      - "8000"
    environment:
      - CLINGEN_LINK_MCP_HOST=0.0.0.0
      - CLINGEN_LINK_MCP_PORT=8000
      - CLINGEN_LINK_MCP_TRANSPORT=unified
      - CLINGEN_LINK_MCP_PATH=/mcp
      - CLINGEN_LINK_LOG_LEVEL=${LOG_LEVEL_API:-INFO}
      - CLINGEN_LINK_CACHE_SIZE=${CLINGEN_CACHE_SIZE:-2000}
      - CLINGEN_LINK_CACHE_TTL_MINUTES=${CLINGEN_CACHE_TTL_MINUTES:-120}
      - 'CLINGEN_LINK_ALLOWED_HOSTS=["localhost","127.0.0.1","::1","clingen-link.genefoundry.org"]'
      - 'CLINGEN_LINK_ALLOWED_ORIGINS=["https://clingen-link.genefoundry.org"]'
      - 'CLINGEN_LINK_CORS_ORIGINS=["https://clingen-link.genefoundry.org"]'
      - CLINGEN_LINK_SNAPSHOT_PATH=/var/lib/clingen/reference/current/clingen.sqlite
      - CLINGEN_LINK_DATA_BUNDLE_PATH=/seed/clingen.sqlite.zst
      - CLINGEN_LINK_DATA_BUNDLE_SHA256=${CLINGEN_LINK_DATA_BUNDLE_SHA256:?set exact compressed SHA-256}
      - CLINGEN_LINK_DATA_EXPANDED_SHA256=${CLINGEN_LINK_DATA_EXPANDED_SHA256:?set exact expanded-tree SHA-256}
    # env_file is provided via the --env-file flag for consistency with siblings.
    command: ["clingen-link", "serve", "--transport", "unified", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: localhost", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    # This overlay is deployed as a SINGLE, self-contained compose file (the
    # GeneFoundry -link fleet standard) — it is NOT layered over
    # docker-compose.yml (note the different service key: `clingen_link` here vs
    # `clingen-link` in the base), so nothing from the base is inherited.
    # read_only, the writable tmpfs, and security_opt must be declared here.
    read_only: true
    volumes:
      - clingen_reference:/var/lib/clingen/reference:ro
    tmpfs:
      # Small scratch space only; authoritative reference data is read-only.
      - /tmp/clingen-link:rw,noexec,nosuid,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    networks:
      - clingen_link_internal_net
      - npm_proxy_network
    deploy:
      resources:
        limits:
          memory: ${CLINGEN_API_MEMORY_LIMIT:-1g}
          cpus: ${CLINGEN_API_CPU_LIMIT:-1.0}
          pids: 256
        reservations:
          memory: 256m
          cpus: 0.25
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "service=clingen-link,environment=production,proxy=npm"
    cap_drop:
      - ALL
    pids_limit: 256
    init: true

networks:
  clingen_link_internal_net:
    driver: bridge
    name: clingen_link_internal_net
  npm_proxy_network:
    external: true
    name: ${NPM_SHARED_NETWORK_NAME:-npm_default}

volumes:
  clingen_reference:
