name: clingen-link-npm

# Nginx Proxy Manager deployment. This overlay is deployed as a SINGLE, self-contained
# compose file (the GeneFoundry -link fleet standard): it is NOT layered over
# docker-compose.yml (note the different service keys), so nothing is inherited.
#
# The image is code-only. `clingen_data_init` verifies the reviewed, digest-pinned bundle
# offline and atomically selects it into `clingen_reference`; the server mounts that volume
# read-only. Set CLINGEN_LINK_DATA_SEED_DIR to the directory holding the reviewed
# `clingen.sqlite.zst` from the data release named in container-release.json.

services:
  clingen_data_init:
    image: "${CLINGEN_LINK_IMAGE:?set an attested image@sha256 digest}"
    pull_policy: missing
    command: ["clingen-link", "materialize-data"]
    environment:
      CLINGEN_LINK_DATA_ROOT: /data
      CLINGEN_LINK_DATA_RELEASE_TAG: "${CLINGEN_LINK_DATA_RELEASE_TAG:-data-clingen-de5f403028d2e1e1}"
      CLINGEN_LINK_DATA_IDENTITY_DIGEST: "${CLINGEN_LINK_DATA_IDENTITY_DIGEST:-sha256:74dc6e1a82f773b17303d33ff82b63c96e9aed0b16fa5f3020b13fd69ffdf789}"
      CLINGEN_LINK_DATA_BUNDLE_PATH: /seed/clingen.sqlite.zst
      CLINGEN_LINK_DATA_BUNDLE_SHA256: "${CLINGEN_LINK_DATA_BUNDLE_SHA256:-ae1dbfb8962b5073a0e9d4acd6ed1c7aa9c72509f00ae61878d9b8531c36492f}"
      CLINGEN_LINK_DATA_EXPANDED_SHA256: "${CLINGEN_LINK_DATA_EXPANDED_SHA256:-b75e39cad2063221f0ad7b004631a134caaaaea4fb6ee87fa40274d41e8f00ba}"
      CLINGEN_LINK_DATA_SCHEMA_VERSION: "${CLINGEN_LINK_DATA_SCHEMA_VERSION:-2.0.0}"
      CLINGEN_LINK_DATA_SCHEMA_MINIMUM: "${CLINGEN_LINK_DATA_SCHEMA_MINIMUM:-2.0.0}"
      CLINGEN_LINK_DATA_SCHEMA_MAXIMUM: "${CLINGEN_LINK_DATA_SCHEMA_MAXIMUM:-2.0.0}"
    volumes:
      - type: bind
        source: "${CLINGEN_LINK_DATA_SEED_DIR:-/srv/genefoundry/clingen-seed}"
        target: /seed
        read_only: true
      - type: volume
        source: clingen_reference
        target: /data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: none
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clingen_link:
    image: "${CLINGEN_LINK_IMAGE:?set an attested image@sha256 digest}"
    pull_policy: missing
    # NPM resolves its upstream by container name (`proxy_pass http://clingen-link-npm:8000`),
    # so it must be pinned. Without it Compose auto-names the container
    # `clingen-link-npm-clingen_link-1`, nginx cannot resolve the upstream, and
    # clingen-link.genefoundry.org goes down. An unresolvable upstream also makes
    # `nginx -s reload` fail, which blocks NPM config changes for every other site.
    container_name: clingen-link-npm
    depends_on:
      clingen_data_init:
        condition: service_completed_successfully
    # NO direct ports exposed - NPM handles all routing.
    expose:
      - "8000"
    environment:
      CLINGEN_LINK_MCP_HOST: 0.0.0.0
      CLINGEN_LINK_MCP_PORT: 8000
      CLINGEN_LINK_MCP_TRANSPORT: unified
      CLINGEN_LINK_MCP_PATH: /mcp
      CLINGEN_LINK_LOG_LEVEL: "${LOG_LEVEL_API:-INFO}"
      CLINGEN_LINK_CACHE_SIZE: "${CLINGEN_CACHE_SIZE:-2000}"
      CLINGEN_LINK_CACHE_TTL_MINUTES: "${CLINGEN_CACHE_TTL_MINUTES:-120}"
      CLINGEN_LINK_ALLOWED_HOSTS: '["localhost","127.0.0.1","::1","clingen-link.genefoundry.org"]'
      CLINGEN_LINK_ALLOWED_ORIGINS: '["https://clingen-link.genefoundry.org"]'
      CLINGEN_LINK_CORS_ORIGINS: '["https://clingen-link.genefoundry.org"]'
      GF_HEALTHCHECK_HOST: "${GF_HEALTHCHECK_HOST:-localhost}"
      CLINGEN_LINK_DATA_ROOT: /data
      CLINGEN_LINK_DATA_RELEASE_TAG: "${CLINGEN_LINK_DATA_RELEASE_TAG:-data-clingen-de5f403028d2e1e1}"
      CLINGEN_LINK_DATA_IDENTITY_DIGEST: "${CLINGEN_LINK_DATA_IDENTITY_DIGEST:-sha256:74dc6e1a82f773b17303d33ff82b63c96e9aed0b16fa5f3020b13fd69ffdf789}"
      CLINGEN_LINK_SNAPSHOT_PATH: /data/current/clingen.sqlite
      CLINGEN_LINK_DATA_BUNDLE_PATH: /seed/clingen.sqlite.zst
      CLINGEN_LINK_DATA_BUNDLE_SHA256: "${CLINGEN_LINK_DATA_BUNDLE_SHA256:-ae1dbfb8962b5073a0e9d4acd6ed1c7aa9c72509f00ae61878d9b8531c36492f}"
      CLINGEN_LINK_DATA_EXPANDED_SHA256: "${CLINGEN_LINK_DATA_EXPANDED_SHA256:-b75e39cad2063221f0ad7b004631a134caaaaea4fb6ee87fa40274d41e8f00ba}"
      CLINGEN_LINK_DATA_SCHEMA_VERSION: "${CLINGEN_LINK_DATA_SCHEMA_VERSION:-2.0.0}"
      CLINGEN_LINK_DATA_SCHEMA_MINIMUM: "${CLINGEN_LINK_DATA_SCHEMA_MINIMUM:-2.0.0}"
      CLINGEN_LINK_DATA_SCHEMA_MAXIMUM: "${CLINGEN_LINK_DATA_SCHEMA_MAXIMUM:-2.0.0}"
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f -H \"Host: $${GF_HEALTHCHECK_HOST}\" http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: on-failure
    # Self-contained: read_only, the writable tmpfs, and security_opt are declared here.
    read_only: true
    volumes:
      - type: volume
        source: clingen_reference
        target: /data
        read_only: true
    tmpfs:
      # Small scratch space only; authoritative reference data is read-only.
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    networks:
      - clingen_link_internal_net
      - npm_proxy_network
    deploy:
      resources:
        limits:
          memory: "${CLINGEN_API_MEMORY_LIMIT:-1g}"
          cpus: "${CLINGEN_API_CPU_LIMIT:-1.0}"
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

networks:
  clingen_link_internal_net:
    driver: bridge
    name: clingen_link_internal_net
  npm_proxy_network:
    external: true
    name: "${NPM_SHARED_NETWORK_NAME:-npm_default}"

volumes:
  clingen_reference:
