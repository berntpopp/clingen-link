name: clingen-link

services:
  clingen-link:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: clingen-link-prod
    ports:
      # Loopback only: an auth=none backend must never be published on 0.0.0.0.
      # A bare `docker compose up` stays reachable solely from the host loopback;
      # the prod/npm overlays drop the host port entirely (ports: !reset []).
      - "127.0.0.1:${CLINGEN_LINK_HOST_PORT:-8479}:8000"
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.docker
        required: false
    environment:
      CLINGEN_LINK_MCP_HOST: 0.0.0.0
      CLINGEN_LINK_MCP_PORT: 8000
      CLINGEN_LINK_MCP_TRANSPORT: unified
      CLINGEN_LINK_MCP_PATH: /mcp
      CLINGEN_LINK_ALLOWED_HOSTS: '["localhost","127.0.0.1","::1"]'
      CLINGEN_LINK_ALLOWED_ORIGINS: '[]'
      CLINGEN_LINK_LOG_LEVEL: INFO
    command: ["clingen-link", "serve", "--transport", "unified", "--host", "0.0.0.0", "--port", "8000"]
    # --- Container & Deployment Hardening Standard v1 (universal gap #1: harden the base) ---
    read_only: true
    tmpfs:
      # The store decompresses the snapshot .zst to a temp .sqlite at startup,
      # so the writable tmpfs must be large enough to hold it.
      - /tmp/clingen-link:rw,noexec,nosuid,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    pids_limit: 256
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
          pids: 256
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: localhost", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - clingen-network

networks:
  clingen-network:
    driver: bridge
