name: clingen-link

services:
  clingen-link:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: clingen-link-prod
    # Dev/local only — loopback-bound (127.0.0.1) so copying this file to a
    # server never publishes the unauthenticated backend on the public IP
    # (Docker would otherwise bind 0.0.0.0 and bypass the host firewall).
    # Production fronts the container with a reverse proxy via the prod/npm
    # overlays (ports: !reset []). Backends are unauthenticated by design.
    ports:
      - "127.0.0.1:${CLINGEN_LINK_HOST_PORT:-8479}:8000"
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.docker
        required: false
    environment:
      CLINGEN_LINK_MCP_HOST: 0.0.0.0
      CLINGEN_LINK_MCP_PORT: 8000
      CLINGEN_LINK_MCP_TRANSPORT: unified
      CLINGEN_LINK_MCP_PATH: /mcp
      CLINGEN_LINK_LOG_LEVEL: INFO
    command: ["clingen-link", "serve", "--transport", "unified", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - clingen-network

networks:
  clingen-network:
    driver: bridge
