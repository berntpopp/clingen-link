# Explicit project name isolates this stack. Without it, Compose defaults the project to the
# parent-dir basename ("docker") — shared by every -link repo that roots its compose at
# docker/docker-compose.yml — pooling unrelated containers/volumes into one "docker" project.
# See https://docs.docker.com/reference/compose-file/version-and-name/
name: clingen-link

# The production image is CODE-ONLY. The authoritative ClinGen snapshot is an immutable,
# digest-pinned GitHub data release (see container-release.json `data`). `clingen-data-init`
# verifies the reviewed bundle offline (network_mode: none) and atomically selects it into
# the `clingen-reference` volume; `clingen-link` then mounts that volume read-only.
#
# Every default below is the exact reviewed data identity of the release named in
# container-release.json. Overriding them points the stack at a DIFFERENT dataset.

services:
  clingen-data-init:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: clingen-link:local
    # Explicit, shell-free argv: this sidecar runs exactly one bounded data process.
    command: ["clingen-link", "materialize-data"]
    # Schema 2.0.0 is the v4 dosage score-code contract (issue #46). The SHA defaults below still
    # name the v1 (prose-in-score) bundle: with schema pinned to 2.0.0 that bundle now FAILS
    # materialization CLOSED (schema mismatch) instead of silently serving the bug v4 fixes.
    # Publishing the v2 data release updates these SHAs alongside container-release.json `data`.
    environment:
      CLINGEN_LINK_DATA_ROOT: /data
      CLINGEN_LINK_DATA_RELEASE_TAG: "${CLINGEN_LINK_DATA_RELEASE_TAG:-data-clingen-2026-07-16}"
      CLINGEN_LINK_DATA_IDENTITY_DIGEST: "${CLINGEN_LINK_DATA_IDENTITY_DIGEST:-sha256:9b8ef2094b31dade597b59cd2f58c3ccbba80f45e8b00d34ec6519291d2e6cbe}"
      CLINGEN_LINK_DATA_BUNDLE_PATH: /seed/clingen.sqlite.zst
      CLINGEN_LINK_DATA_BUNDLE_SHA256: "${CLINGEN_LINK_DATA_BUNDLE_SHA256:-8ef351827e0ac86741891af4e53d91c1793f6c6cfc278754bff107774f9dd53c}"
      CLINGEN_LINK_DATA_EXPANDED_SHA256: "${CLINGEN_LINK_DATA_EXPANDED_SHA256:-7ae25cfbaa265cb99848f26b58171e713af458b00c6b5ddd71d4bc5b16a4f552}"
      CLINGEN_LINK_DATA_SCHEMA_VERSION: "${CLINGEN_LINK_DATA_SCHEMA_VERSION:-2.0.0}"
      CLINGEN_LINK_DATA_SCHEMA_MINIMUM: "${CLINGEN_LINK_DATA_SCHEMA_MINIMUM:-2.0.0}"
      CLINGEN_LINK_DATA_SCHEMA_MAXIMUM: "${CLINGEN_LINK_DATA_SCHEMA_MAXIMUM:-2.0.0}"
    volumes:
      # A reviewed, pre-seeded artifact directory: read-only, never a system path.
      - type: bind
        source: "${CLINGEN_LINK_DATA_SEED_DIR:-/srv/genefoundry/clingen-seed}"
        target: /seed
        read_only: true
      - type: volume
        source: clingen-reference
        target: /data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No egress at all: the bundle is already on disk and is verified by digest.
    network_mode: none
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  clingen-link:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: clingen-link:local
    depends_on:
      clingen-data-init:
        condition: service_completed_successfully
    ports:
      # Loopback only: an auth=none backend must never be published on 0.0.0.0.
      # A bare `docker compose up` stays reachable solely from the host loopback;
      # the prod/npm overlays drop the host port entirely (ports: !reset []).
      - "127.0.0.1:${CLINGEN_LINK_HOST_PORT:-8479}:8000"
    expose:
      - "8000"
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.docker
        required: false
    environment:
      CLINGEN_LINK_MCP_HOST: 0.0.0.0
      CLINGEN_LINK_MCP_PORT: 8000
      CLINGEN_LINK_MCP_TRANSPORT: unified
      CLINGEN_LINK_MCP_PATH: /mcp
      CLINGEN_LINK_ALLOWED_HOSTS: '["localhost","127.0.0.1","::1"]'
      CLINGEN_LINK_ALLOWED_ORIGINS: '[]'
      CLINGEN_LINK_LOG_LEVEL: INFO
      GF_HEALTHCHECK_HOST: "${GF_HEALTHCHECK_HOST:-localhost}"
      CLINGEN_LINK_DATA_ROOT: /data
      CLINGEN_LINK_DATA_RELEASE_TAG: "${CLINGEN_LINK_DATA_RELEASE_TAG:-data-clingen-2026-07-16}"
      CLINGEN_LINK_DATA_IDENTITY_DIGEST: "${CLINGEN_LINK_DATA_IDENTITY_DIGEST:-sha256:9b8ef2094b31dade597b59cd2f58c3ccbba80f45e8b00d34ec6519291d2e6cbe}"
      CLINGEN_LINK_SNAPSHOT_PATH: /data/current/clingen.sqlite
      CLINGEN_LINK_DATA_BUNDLE_PATH: /seed/clingen.sqlite.zst
      CLINGEN_LINK_DATA_BUNDLE_SHA256: "${CLINGEN_LINK_DATA_BUNDLE_SHA256:-8ef351827e0ac86741891af4e53d91c1793f6c6cfc278754bff107774f9dd53c}"
      CLINGEN_LINK_DATA_EXPANDED_SHA256: "${CLINGEN_LINK_DATA_EXPANDED_SHA256:-7ae25cfbaa265cb99848f26b58171e713af458b00c6b5ddd71d4bc5b16a4f552}"
      CLINGEN_LINK_DATA_SCHEMA_VERSION: "${CLINGEN_LINK_DATA_SCHEMA_VERSION:-2.0.0}"
      CLINGEN_LINK_DATA_SCHEMA_MINIMUM: "${CLINGEN_LINK_DATA_SCHEMA_MINIMUM:-2.0.0}"
      CLINGEN_LINK_DATA_SCHEMA_MAXIMUM: "${CLINGEN_LINK_DATA_SCHEMA_MAXIMUM:-2.0.0}"
    # --- Container & Deployment Hardening Standard v1 ---
    read_only: true
    volumes:
      # The selected snapshot is authoritative and immutable: mount it read-only.
      - type: volume
        source: clingen-reference
        target: /data
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
          pids: 256
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f -H \"Host: $${GF_HEALTHCHECK_HOST}\" http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  clingen-reference:
