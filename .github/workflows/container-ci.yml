name: Container CI

on:
  pull_request:
    paths:
      - clingen_link/**
      - docker/**
      - scripts/**
      - pyproject.toml
      - uv.lock
      - container-release.json
      - vendor/genefoundry/**
      - .github/workflows/container-ci.yml
      - .github/workflows/container-release.yml
      - .github/workflows/data-refresh.yml
  push:
    branches:
      - main
    paths:
      - clingen_link/**
      - docker/**
      - scripts/**
      - pyproject.toml
      - uv.lock
      - container-release.json
      - vendor/genefoundry/**
      - .github/workflows/container-ci.yml
      - .github/workflows/container-release.yml
      - .github/workflows/data-refresh.yml

concurrency:
  group: container-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  container-ci:
    uses: berntpopp/genefoundry-router/.github/workflows/_container-ci.yml@2e27a1b519aeb9aa32324295dccbe37e6309bdd9
