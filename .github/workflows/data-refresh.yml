name: Immutable ClinGen data release

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      publish:
        description: Request protected release validation
        required: true
        default: false
        type: boolean

concurrency:
  group: data-clingen-${{ github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      tag: ${{ steps.bundle.outputs.tag }}
      artifact_name: clingen-data-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: {version: "0.8.7"}
      - name: Build nonpublishing sealed snapshot
        id: bundle
        run: |
          set -euo pipefail
          uv sync --group dev --frozen
          out="$RUNNER_TEMP/data-release"; mkdir -p "$out"
          uv run clingen-link refresh --out "$out/clingen.sqlite"
          OUT="$out" uv run python - <<'PY'
          import hashlib, json, os, sqlite3
          from pathlib import Path
          import zstandard
          from clingen_link.data_contract import SNAPSHOT_SCHEMA_SEMVER
          from clingen_link.etl.release_identity import sealed_identity
          out=Path(os.environ["OUT"]); raw=out/"clingen.sqlite"; bundle=out/"clingen.sqlite.zst"
          with raw.open("rb") as src, bundle.open("wb") as dst: zstandard.ZstdCompressor(level=19).copy_stream(src,dst)
          raw_sha=hashlib.sha256(raw.read_bytes()).hexdigest(); compressed=hashlib.sha256(bundle.read_bytes()).hexdigest()
          with sqlite3.connect(raw) as conn:
              counts=dict(conn.execute("SELECT domain, record_count FROM meta")); source_sha=hashlib.sha256("".join(sorted(row[0] for row in conn.execute("SELECT content_sha256 FROM meta"))).encode()).hexdigest()
          expanded=hashlib.sha256(f"clingen.sqlite\0{0o444:o}\0{raw.stat().st_size}\0{raw_sha}".encode()).hexdigest()
          manifest={"schema_version":1,"dataset":{"name":"ClinGen curated evidence snapshot","source":{"identifier":"clingen-content-sha256","url":"https://clinicalgenome.org/","sha256":source_sha}},"schema":{"minimum":SNAPSHOT_SCHEMA_SEMVER,"maximum":SNAPSHOT_SCHEMA_SEMVER,"actual":SNAPSHOT_SCHEMA_SEMVER},"record_counts":counts,"artifact":{"filename":bundle.name,"sha256":compressed,"compressed_size":bundle.stat().st_size,"max_compressed_size":67108864,"expanded_tree_sha256":expanded,"expanded_size":raw.stat().st_size,"max_expanded_size":268435456,"member_count":1,"max_members":1},"previous_known_good_digest":"sha256:e0204a40541e82fb86cf4725a2b5fa9edc5e0eec838ada9564fa8de973c51626"}
          identity=sealed_identity(manifest); manifest["dataset"]["release"]=identity.tag
          (out/"data-release-manifest.json").write_text(json.dumps(manifest,sort_keys=True,indent=2)+"\n"); raw.unlink()
          (out/"SHA256SUMS").write_text(f"{compressed}  {bundle.name}\n{hashlib.sha256((out/'data-release-manifest.json').read_bytes()).hexdigest()}  data-release-manifest.json\n")
          Path(os.environ["GITHUB_OUTPUT"]).open("a").write(f"tag={identity.tag}\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clingen-data-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/data-release
          if-no-files-found: error
          retention-days: 3

  validate-publication:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: build
    runs-on: ubuntu-latest
    environment: data-release
    permissions: {contents: read}
    outputs:
      approval_name: clingen-approval-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: {version: "0.8.7"}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/data-release
      - name: validate_rights_record and seal exact approval
        env:
          CLINGEN_RIGHTS_RECORD_JSON: ${{ secrets.CLINGEN_RIGHTS_RECORD_JSON }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$CLINGEN_RIGHTS_RECORD_JSON"
          uv sync --group dev --frozen
          HANDOFF="$RUNNER_TEMP/data-release" APPROVAL="$RUNNER_TEMP/approval.json" uv run python - <<'PY'
          import hashlib,json,os
          from datetime import UTC,datetime
          from pathlib import Path
          from clingen_link.etl.release_identity import sealed_identity
          from clingen_link.etl.rights_record import validate_rights_record
          handoff=Path(os.environ["HANDOFF"]); expected={"clingen.sqlite.zst","data-release-manifest.json","SHA256SUMS"}
          if {p.name for p in handoff.iterdir()} != expected: raise SystemExit("unexpected handoff asset")
          sums=dict(line.split(None,1) for line in (handoff/"SHA256SUMS").read_text().splitlines())
          for name in expected-{ "SHA256SUMS" }:
              if hashlib.sha256((handoff/name).read_bytes()).hexdigest()!=sums.get(name): raise SystemExit("checksum mismatch")
          identity=sealed_identity(json.loads((handoff/"data-release-manifest.json").read_text()))
          if identity.tag!=os.environ["TAG"]: raise SystemExit("tag mismatch")
          rights=validate_rights_record(json.loads(os.environ["CLINGEN_RIGHTS_RECORD_JSON"]),identity)
          approval={"run_id":os.environ["GITHUB_RUN_ID"],"run_attempt":os.environ["GITHUB_RUN_ATTEMPT"],"artifact_name":f"clingen-data-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}","tag":identity.tag,"source_sha256":identity.source_sha256,"artifact_sha256":identity.artifact_sha256,"rights_record_digest":rights.digest,"validated_at":datetime.now(UTC).isoformat()}
          Path(os.environ["APPROVAL"]).write_text(json.dumps(approval,sort_keys=True))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clingen-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approval.json
          if-no-files-found: error
          retention-days: 3

  publish-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
    needs: [build, validate-publication]
    runs-on: ubuntu-latest
    environment: data-release
    permissions: {contents: write, id-token: write, attestations: write}
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/data-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.validate-publication.outputs.approval_name }}
          path: ${{ runner.temp }}/approval
      - name: Verify previous known-good rollback target
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/data-release"; sha256sum --check SHA256SUMS
          test "$(jq -r .run_id "$RUNNER_TEMP/approval/approval.json")" = "$GITHUB_RUN_ID"
          test "$(jq -r .run_attempt "$RUNNER_TEMP/approval/approval.json")" = "$GITHUB_RUN_ATTEMPT"
          test "$(jq -r .artifact_name "$RUNNER_TEMP/approval/approval.json")" = "clingen-data-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test "$(jq -r .tag "$RUNNER_TEMP/approval/approval.json")" = "$TAG"
          timeout 30s gh api --method GET "repos/$GH_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/release.err" || true
          if [ -s "$RUNNER_TEMP/release.json" ]; then
            test "$(jq -r .isDraft "$RUNNER_TEMP/release.json")" = true || exit 0
            jq -e '[.assets[].name] | sort == ["SHA256SUMS","clingen.sqlite.zst","data-release-manifest.json"]' "$RUNNER_TEMP/release.json" >/dev/null
            timeout 60s gh release download "$TAG" --dir "$RUNNER_TEMP/existing" --pattern data-release-manifest.json --pattern SHA256SUMS
            cmp data-release-manifest.json "$RUNNER_TEMP/existing/data-release-manifest.json"
            cmp SHA256SUMS "$RUNNER_TEMP/existing/SHA256SUMS"; state=draft_publish_existing
          elif grep -q '404' "$RUNNER_TEMP/release.err"; then state=create
          else cat "$RUNNER_TEMP/release.err" >&2; exit 1; fi
          printf '%s\n' "$state" > "$RUNNER_TEMP/release-state"
      - name: Create only an absent draft or publish exact existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/data-release"
          if [ "$(cat "$RUNNER_TEMP/release-state")" = create ]; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "Immutable ClinGen reference snapshot. Research use only; not clinical decision support."
            gh release upload "$TAG" clingen.sqlite.zst data-release-manifest.json SHA256SUMS
          fi
          gh attestation verify clingen.sqlite.zst --repo "$GH_REPO"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/data-release/clingen.sqlite.zst
            ${{ runner.temp }}/data-release/data-release-manifest.json
      - name: Publish once and verify immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/data-release"
          gh release edit "$TAG" --draft=false
          gh release verify-asset "$TAG" clingen.sqlite.zst
          gh release verify-asset "$TAG" data-release-manifest.json
          gh release verify-asset "$TAG" SHA256SUMS
