name: Docker

on:
  pull_request:
    paths:
      - "docker/**"
      - "clingen_link/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - main
    paths:
      - "docker/**"
      - "clingen_link/**"
      - "pyproject.toml"
      - "uv.lock"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-compose:
    name: Validate Compose configs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render base compose
        run: docker compose -f docker/docker-compose.yml config

      - name: Render production compose
        run: >-
          docker compose --env-file .env.docker.example
          -f docker/docker-compose.yml -f docker/docker-compose.prod.yml config

      - name: Render NPM compose
        run: docker compose -f docker/docker-compose.npm.yml --env-file .env.docker.example config

  build-image:
    name: Build production image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: docker build -f docker/Dockerfile -t clingen-link:ci .
